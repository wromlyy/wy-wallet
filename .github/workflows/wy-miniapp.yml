name: WY Wallet Mini App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wy-miniapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      HUSKY: '0'
      NODE_OPTIONS: --max-old-space-size=6144
      BASE_URL: https://wromlyy.github.io/wy-wallet/
      BOT_USERNAME: ${{ vars.BOT_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run i18n:build:default
      - run: npx tsc --noEmit
      - run: APP_ENV=test npx jest src/config.matrix.test.ts src/util/langProvider.test.ts --runInBand
      - run: npm run telegram:build:production
      - run: npx playwright install --with-deps chromium
      - run: node dev/smokeWyMiniapp.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WY-Wallet-Preview
          path: test-results/wy-miniapp
          if-no-files-found: ignore
      - name: Include license and deployment metadata
        run: |
          cp LICENSE dist/LICENSE.txt
          cp UPSTREAM.md dist/UPSTREAM.md
          touch dist/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: WY-Wallet-Telegram-Mini-App
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Mini App
        id: deployment
        uses: actions/deploy-pages@v4
